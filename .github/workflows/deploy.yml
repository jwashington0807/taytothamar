name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::374196135538:role/github-actions-tay2thamar-deploy
          aws-region: us-east-1

      - run: aws s3 sync dist/tay2thamar/browser/ s3://tay2thamar-web-devprod/ --delete

      - run: aws cloudfront create-invalidation --distribution-id E3V15MJ1E4H6UO --paths "/*"
